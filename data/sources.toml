# Every publisher cited in data/evidence/*.toml, keyed by the id used in `by = "..."`.
# counts_as: publishers that copy one another, or share a publisher, count as one independent source.
# confirms = false: cited, but never counted as confirmation (chords-db and the sites that copy it).

[8notes]
name = "8notes"
site = "https://8notes.com/"
counts_as = "chords-db"
note = "copies most of its diagrams from chords-db"

[akordy]
name = "akordy.kytary.cz"
site = "https://akordy.kytary.cz/"
counts_as = "chords-db"
note = "reproduces chords-db"

[chordbank]
name = "ChordBank"
site = "https://chordbank.com/"

[chords-db]
name = "chords-db"
site = "https://github.com/tombatossals/chords-db"
confirms = false

[dummies]
name = "Guitar For Dummies"
site = "https://dummies.com/"

[fachords]
name = "fachords"
site = "https://fachords.com/"
